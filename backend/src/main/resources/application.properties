spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
api.security.token.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
app.seed.demo-enabled=${APP_SEED_DEMO_ENABLED:false}

# Existing schemas are adopted at V1; new databases execute V1 before V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
