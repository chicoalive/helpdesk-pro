spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
api.security.token.secret=${JWT_SECRET:local-dev-jwt-secret-key-not-for-production-use}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
app.seed.demo-enabled=${APP_SEED_DEMO_ENABLED:false}
