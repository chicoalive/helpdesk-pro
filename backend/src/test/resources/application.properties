spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
api.security.token.secret=test-jwt-secret-key-for-automated-integration-tests-only
cors.allowed-origins=http://localhost:4200,https://helpdesk-pro-demo.vercel.app
app.seed.demo-enabled=false
spring.flyway.enabled=false
